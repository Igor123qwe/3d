name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: В репозитории нет зависимостей, сборки и ключей
        run: |
          junk="$(git ls-files node_modules dist .env)"
          if [ -n "$junk" ]; then echo "Эти пути не должны быть в git: $junk"; exit 1; fi
      - run: npm ci
      - name: Проверка типов
        run: npx tsc --noEmit -p .
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build

  # Сборка в настоящем браузере: страница открывается, шаблон, каталог, электрика
  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Браузер для проверки
        run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - name: Дымовая проверка
        run: npm run smoke
