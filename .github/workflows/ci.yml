name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Проверка типов
        run: npx tsc --noEmit -p .
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build
